name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# checks: write is what lets the test report be published as a check run; everything else stays read only
permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: passw0rd
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 18223:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: passw0rd
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        id: build
        run: dotnet build TradeServerDb.slnx -c Release --nologo

      - name: Unit tests
        run: >-
          dotnet test src/Migrator.Tests/Migrator.Tests.csproj -c Release --no-build --nologo
          --filter "Category!=Integration"
          --logger "junit;LogFilePath=../../test-reports/unit-tests.xml"

      - name: Integration tests
        env:
          ASPNETCORE_ENVIRONMENT: integration
        run: >-
          dotnet test src/Migrator.Tests/Migrator.Tests.csproj -c Release --no-build --nologo
          --filter "Category=Integration"
          --logger "junit;LogFilePath=../../test-reports/integration-tests.xml"

      # the JUnit XML is otherwise only downloadable from the artefact below, so a failure is invisible on the
      # run page. This parses both reports into the job summary and into a check run, with an annotation on the
      # failing test. It runs whether the tests passed or failed, but not when the build never produced a
      # report - require_tests would then fail on an empty glob and bury the actual error
      - name: Publish test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: test-reports/*.xml
          check_name: Test results
          detailed_summary: true
          group_suite: true
          require_tests: true
          # dotnet test already fails the job on a failing test; this step only reports
          fail_on_failure: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: test-reports/
