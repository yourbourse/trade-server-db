name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: passw0rd
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 18223:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: passw0rd
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TradeServerDb.slnx -c Release --nologo

      - name: Unit tests
        run: >-
          dotnet test src/Migrator.Tests/Migrator.Tests.csproj -c Release --no-build --nologo
          --filter "Category!=Integration"
          --logger "junit;LogFilePath=../../test-reports/unit-tests.xml"

      - name: Integration tests
        env:
          ASPNETCORE_ENVIRONMENT: integration
        run: >-
          dotnet test src/Migrator.Tests/Migrator.Tests.csproj -c Release --no-build --nologo
          --filter "Category=Integration"
          --logger "junit;LogFilePath=../../test-reports/integration-tests.xml"

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: test-reports/
